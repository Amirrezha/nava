<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title> نوا</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- قلب‌های پس‌زمینه -->
    <div class="hearts"></div>


    <!-- کارت اصلی -->
    <main class="card">

        <!-- قلب بالای صفحه -->
        <div class="heart-icon">♥</div>


        <!-- سؤال -->
        <h1 id="question">
            نوا میای بریم بیرون؟
        </h1>


        <!-- متن کوچک -->
        <p id="subtext">
            یه سؤال خیلی مهم ازت دارم...
        </p>


        <!-- دکمه‌ها -->
        <div class="buttons">

    <button id="yesBtn">
        آره
    </button>

    <button id="noBtn">
        نه
    </button>

</div>

<img
    id="noGif"
    src="funny.gif"
    alt="Funny GIF"
    class="no-gif"
>


        <!-- صفحه بعد از زدن آره -->
        <div id="success" class="success">

            <img
                src="date.gif"
                alt="Date GIF"
                class="date-gif"
            >

            <h2>
                خب حالا کی به ندا جون میگی میری بیرون؟
            </h2>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
